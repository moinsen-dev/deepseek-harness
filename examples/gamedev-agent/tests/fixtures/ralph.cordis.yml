- id: gamedev-ralph-mock-llm
  name: './gamedev-ralph-mock-llm.ts'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: workflow
  name: '@deepseek-ai/dsh-workflow-worker-thread'

- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'

- id: tool-ralph
  name: '@deepseek-ai/dsh-tool-ralph'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: gamedev-ralph-mock
              model: gamedev-ralph-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          dshHome: './.dsh-home'
          skills:
            filesystem:
              agentsHome: './.agents-home'
          persona: 'Keyless gamedev-agent ralph smoke.'
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
