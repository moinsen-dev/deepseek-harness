# One-shot game-developer agent with format-pure stdout. The app bin loads the
# gitignored root `.env` into the process environment; entry configs here are
# the composition base, while user-plane values resolve per request through
# the two providers below.

# User-settings document (`$DSH_HOME/settings.yaml`, hot-reloaded): a
# `llm-deepseek:` section there overrides the adapter entry below without a
# restart.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# Credential store: the live process environment over `$DSH_HOME/.credentials.yaml`
# (owner-only file, hot-reloaded). The adapter resolves `DEEPSEEK_API_KEY`
# through it at each request, so no key is inlined in this file.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# The DeepSeek adapter.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-pro
        contextWindow: 128000
      - id: deepseek-v4-flash
        contextWindow: 128000

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    timeoutMs: 60000

# The example composition pre-creates one fresh `main` agent for its test driver.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are gamedev-agent, a game developer powered by the {{model}} model.

      Verify game behavior by playing it with game_play using a fixed input
      sequence. Keep answers brief and cite the observed score and state.

# The game capability: deterministic games, the model-facing play tools, and
# the gauntlet loop that scores rounds against a quality bar.
- id: game
  name: '@deepseek-ai/dsh-game'

- id: game-sim
  name: '@deepseek-ai/dsh-game-sim'

- id: tool-game
  name: '@deepseek-ai/dsh-tool-game'

# The model drives gauntlet rounds through gauntlet_round; the runtime assigns
# strictly increasing attempts and logs every round.
- id: tool-gauntlet
  name: '@deepseek-ai/dsh-tool-gauntlet'

- id: gauntlet
  name: '@deepseek-ai/dsh-game-gauntlet'

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
