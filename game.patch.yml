# Patch overlay for `dsh web`: inserts the game capability into the booted
# tree. The subagent/workflow/ralph stack already ships in the web profile, so
# only the game rows are new. Every row stays patchable; load order resolves
# through service injection.
- insert:
    - id: game
      name: '@deepseek-ai/dsh-game'
    - id: game-sim
      name: '@deepseek-ai/dsh-game-sim'
    - id: engine-godot
      name: '@deepseek-ai/dsh-engine-godot'
    - id: tool-game
      name: '@deepseek-ai/dsh-tool-game'
    - id: tool-game-build
      name: '@deepseek-ai/dsh-tool-game-build'
    - id: gauntlet
      name: '@deepseek-ai/dsh-game-gauntlet'
    - id: tool-gauntlet
      name: '@deepseek-ai/dsh-tool-gauntlet'
